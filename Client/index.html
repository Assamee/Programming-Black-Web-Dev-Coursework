<!-- Client/index.html -->
<!-- === Main HTML File for Calendar Application === -->

<!doctype html>
<!--Throughout this code the Bootstrap framework has been used -->
<!-- I am making a Calendar Application with a vertical timeline. (Like the Google Calendar Schedule Mode) -->
<html lang="en" data-bs-theme="dark"> <!-- data-bs-theme is for Bootstrap to use Dark Mode -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Calendar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!--type="module" means the script is treated as a JavaScript module, so you can use import/export statements inside it-->
        <script type="module" src="Calendar.js" defer></script> <!-- defer tells the browser to not wait for the script to load (loads it in the backgound) -->
    </head>
    <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!--Navbar-->
    <div class="sticky-top p-2 mb-0 border-bottom border-secondary text-white bg-body-tertiary"> <!--sticky-top keeps it fixed to the top when scrolling-->
        <div class="container">
            <div class="row align-items-center"> <!-- align-items-center centers the content vertically -->

                <div class="col-auto"> <!-- col-auto flexibly changes column width based on content -->
                    <button class="btn btn-primary" data-bs-target="#InputEventDetails" data-bs-toggle="modal"> <!-- data-bs-target is the id of the modal to open -->
                        <span class="fw-bold">Add Event</span>
                    </button>
                </div>

                <!-- Centered Title -->
                <div class="col">
                    <div class="text-center">
                        <!-- Title change for different screen sizes -->
                        <!-- h4 for medium and larger screens, h6 for small screens, m-0 is margin 0-->
                        <!--d-none hides the element, d-sm-block displays the element on small, medium and larger screens (hidden on extra small screens with d-none)-->
                        <h1 class="h4 m-0 fw-bold d-none d-sm-block">Welcome to my Calendar!</h1> 
                        <!--d-sm-none hides the element on small medium and large screens (visible on extra small screens)-->
                        <h1 class="h6 m-0 fw-bold d-sm-none">My Calendar</h1>
                    </div>
                </div>

                <!--Invisible button to keep the title centered-->
                <div class="col-auto d-none d-sm-block" style="visibility: hidden;">
                    <button class="btn btn-primary"><span class="fw-bold">Add Event</span></button>
                </div>

            </div>
        </div>
    </div>

    <div class="container-fluid"> <!--container-fluid for full width -->
            <div id="DisplayEvents" class="row">
                <!-- Events will be dynamically inserted here -->
            </div>
    </div>

        <div> <!-- Modals -->  
            <!-- Title Modal -->
            <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
            <div class="modal fade" id="TitleModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Add Event Title</h1> <!-- fs-5 is font size 5 -->
                            <!-- Button to close the modal -->
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!--Text Box to input the Title-->
                            <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                                <input type="text" class="form-control" id="TitleInput" placeholder="Title">
                                <label for="floatingInput">Title</label>
                            </div>
                        </div>
                        <!--Button to go to Description Modal-->
                        <div class="modal-footer">
                            <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Continue</button> <!-- data-bs-target is the id of the modal to open -->
                        </div>
                    </div>
                </div>
            </div>
            <!-- Description Modal -->
            <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
            <div class="modal fade" id="DescriptionModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Description</h1> <!-- fs-5 is font size 5 -->
                            <!-- Button to close the modal -->
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!--Text Box to input the Description-->
                            <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                                <textarea class="form-control" id="DescriptionInput" placeholder="Description"></textarea> <!-- Textarea for multi-line input -->
                                <label for="floatingInput">Description</label>
                            </div>
                        </div>
                        <!--Button to go to other Modals-->
                        <div class="modal-footer">
                            <!--Button to Return to Title Modal-->
                            <button class="btn btn-primary" data-bs-target="#TitleModal" data-bs-toggle="modal">Back</button>
                            <!--Button to go to the Location Modal-->
                            <button class="btn btn-primary" data-bs-target="#LocationModal" data-bs-toggle="modal">Continue</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Location Modal -->
            <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
            <div class="modal fade" id="LocationModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Location</h1> <!-- fs-5 is font size 5 -->
                            <!-- Button to close the modal -->
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!--Text Box to input the Location-->
                            <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                                <input type="text" class="form-control" id="LocationInput" placeholder="Location">
                                <label for="floatingInput">Location</label>
                            </div>
                        </div>
                        <!--Button to Return to Descrption Modal-->
                        <div class="modal-footer">
                            <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Back</button>
                            <!--Button to go to the Time Modal-->
                            <button class="btn btn-primary" data-bs-target="#TimeModal" data-bs-toggle="modal">Continue</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Time Modal -->
            <div class="modal fade" id="TimeModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Time</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                        <!--Input for the Start Date-->
                            <div class="form-floating mb-3">
                                <input type="datetime-local" class="form-control" id="StartDateInput" placeholder="Date">
                                <label for="floatingInput">Start Date</label>
                            </div>
                        <!--Input for the End Date-->
                            <div class="form-floating mb-3">
                                <input type="datetime-local" class="form-control" id="EndDateInput" placeholder="Date">
                                <label for="floatingInput">End Date</label>
                            </div>
                        </div>
                        <!--Modal Footer    -->
                        <div class="modal-footer">
                            <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Back</button>
                            <!--Button to Save-->
                            <!-- data-bs-dismiss closes the modal -->
                            <!-- Defensively specified to be a button in case I want to add form submission later for input validation -->
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close" id="SaveEventButton">Save</button> <!-- Added an ID to be Used in JavaScript -->
                        </div>
                    </div>
                </div>
            </div>   
        </div>

    <!--New Modal Approach-->
    <form id="newEventForm" novalidate>
        <div class="modal fade" id="InputEventDetails" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Details</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    <!--Text Box to input the Title-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="TitleInput" name="title" placeholder="Title">
                            <label for="floatingInput">Title*</label>
                        </div>
                    <!--Text Box to input the Description-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <textarea class="form-control" id="DescriptionInput" name="description" placeholder="Description"></textarea> <!-- Textarea for multi-line input -->
                            <label for="floatingInput">Description</label>
                        </div>
                    <!--Text Box to input the Location-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="LocationInput" name="location" placeholder="Location">
                            <label for="floatingInput">Location</label>
                        </div>
                    <!--Input for the Start Date-->
                        <div class="form-floating mb-3">
                            <input type="datetime-local" class="form-control" id="StartDateInput" name="startDate" placeholder="Date">
                            <label for="floatingInput">Start Date*</label>
                        </div>
                    <!--Input for the End Date-->
                        <div class="form-floating mb-3">
                            <input type="datetime-local" class="form-control" id="EndDateInput" name="endDate" placeholder="Date">
                            <label for="floatingInput">End Date</label>
                        </div>
                        <span class="text-muted small">* Required Field</span>
                    </div>
                    <!--Modal Footer-->
                    <div class="modal-footer">
                        <!--Button to Save-->
                        <!-- data-bs-dismiss closes the modal -->
                        <!-- Defensively specified to be a button in case I want to add form submission later for input validation -->
                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close" id="SaveEventButton">Save</button> <!-- Added an ID to be Used in JavaScript -->
                    </div>
                </div>
            </div>
        </div> 
    </form>




    <!--Current Display Events-->
    <div class="col-12">
        <!-- Date Header (Displays the LARGE date)-->
        <div class="sticky-top bg-body-tertiary p-2 px-3 fw-bold border-bottom border-secondary mb-0 shadow-sm">
            SUN, 12 JAN <!--Date ID-->
        </div>

        <div class="list-group list-group-flush mb-5">
            
            <button type="button" class="list-group-item list-group-item-action list-group-item-dark border-start border-4 border-danger border-end-0 py-3 px-2" data-bs-toggle="modal" data-bs-target="#EventDetailModal">
                
                <div class="row align-items-center w-100 g-0 flex-nowrap">
                    
                    <div class="col-auto text-center flex-shrink-0" style="width: 80px;">
                        <div class="fw-bold">09:00</div>
                        <div class="text-danger small fw-bold">
                            Jan 14<br>17:00
                        </div>
                    </div>

                    <div class="col-auto text-center px-2">
                        <div class="d-inline-block border-end border-2 h-100" style="min-height: 40px;"></div>
                    </div>

                    <div class="col ps-2" style="min-width: 0;">
                        <div class="d-flex justify-content-between align-items-center">

                            <div class="text-truncate pe-2">
                                <h6 class="mb-0 fw-bold text-truncate">Hackathon</h6>
                                <small class="text-muted text-truncate d-block">📍 Main Hall</small>
                            </div>

                            <span class="badge rounded-pill bg-danger flex-shrink-0">Important</span>
                        </div>
                    </div>

                </div>
            </button>

        </div>
    </div>

    <div class="modal fade" id="EventDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Event Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body">
                    <h4 id="DetailTitle" class="fw-bold">[Title]</h4>
                    <p id="DetailDescription" class="text-secondary">[Description]</p>
                    
                    <hr>
                    
                    <div class="mb-2">
                        <strong>📍 Location:</strong> <span id="DetailLocation">[Location]</span>
                    </div>
                    <div>
                        <strong>🕒 Time:</strong> <span id="DetailTime">[Time]</span>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="EditEventButton">Edit</button>
                    <button type="button" class="btn btn-danger" id="DeleteEventButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    </body>
</html>
