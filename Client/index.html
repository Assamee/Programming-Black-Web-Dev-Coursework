<!-- Client/index.html -->
<!-- === Main HTML File for Calendar Application === -->

<!doctype html>
<!--Throughout this code the Bootstrap framework has been used -->
<!-- I am making a Calendar Application with a vertical timeline. (Like the Google Calendar Schedule Mode) -->
<html lang="en" data-bs-theme="dark"> <!-- data-bs-theme is for Bootstrap to use Dark Mode -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Calendar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!--type="module" means the script is treated as a JavaScript module, so you can use import/export statements inside it-->
        <script type="module" src="Calendar.js" defer></script> <!-- defer tells the browser to not wait for the script to load (loads it in the backgound) -->
    </head>
    <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!--Navbar-->
    <div class="navbar sticky-top p-2 mb-0 border-bottom border-secondary text-white bg-body-tertiary"> <!--sticky-top keeps it fixed to the top when scrolling-->
        <div class="container-fluid"> <!--container-fluid for full width -->
            <div class="row align-items-center w-100 m-0"> <!-- align-items-center centers the content vertically -->
                
                <!--Add Event Button-->
                <div class="col-auto col-md-4 p-0 d-flex justify-content-start"> <!-- col-auto flexibly changes column width based on content -->
                    <button class="btn btn-primary" data-bs-target="#InputEventDetails" data-bs-toggle="modal"> <!-- data-bs-target is the id of the modal to open -->
                        <span class="fw-bold d-none d-sm-inline">Add Event</span>
                        <span class="fw-bold d-sm-none">+</span>
                    </button>
                </div>

                <!-- Centered Title -->
                <div class="col col-md-4 p-0">
                    <div class="text-center">
                        <!-- Title change for different screen sizes -->
                        <!-- h4 for medium and larger screens, h6 for small screens, m-0 is margin 0-->
                        <!--d-none hides the element, d-md-block displays the element on medium, large and extra large screens (hidden on small and extra small screens with d-none)-->
                        <h1 class="h4 m-0 fw-bold d-none d-md-block text-truncate">Welcome to my Calendar!</h1> 
                        <!--d-md-none hides the element on medium, large and extra large screens (visible on small and extra small screens)-->
                        <h1 class="h4 m-0 fw-bold d-md-none text-truncate">Calendar</h1>
                    </div>
                </div>

                <!--Search Bar implemented as a form-->
                <div class="col-auto col-md-4 p-0 d-flex justify-content-end">
                    <form id="SearchForm" class="d-flex w-100 justify-content-end" role="search" onsubmit="return false;">
                        <div class="form-floating mb-0 w-100"> <!-- form-floating is for floating labels, w-100 is width 100%, mb-0 is margin bottom 0 -->
                            <!-- Search Input Box -->
                            <input type="search" class="form-control text-white" id="SearchInput" placeholder="Search events..." aria-label="Search">
                            <label for="SearchInput">Search events...</label>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!--Main Container for Events-->
    <div class="container-fluid"> <!--container-fluid for full width -->
            <div id="DisplayEvents" class="row">
                <!-- Events will be dynamically inserted here -->
            </div>
    </div>

    <!--Add Event Modal-->
    <div class="modal fade" id="InputEventDetails" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!--Form for adding a new event-->
                <form id="newEventForm" novalidate>
                    <div class="modal-body">
                    <!--Text Box to input the Title-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="TitleInput" name="title" placeholder="Title">
                            <label for="floatingInput">Title*</label>
                        </div>
                    <!--Text Box to input the Description-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <textarea class="form-control" id="DescriptionInput" name="description" placeholder="Description"></textarea> <!-- Textarea for multi-line input -->
                            <label for="floatingInput">Description</label>
                        </div>
                    <!--Text Box to input the Location-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="LocationInput" name="location" placeholder="Location">
                            <label for="floatingInput">Location</label>
                        </div>
                    <!--Dropdown to select the Event Type-->
                        <div class="form-floating mb-3">
                            <div class="input-group">
                                <!--Dropdown Select for Event Type-->
                                <select class="form-select" id="TypeInput" name="eventType" required>
                                    <option selected disabled value="" for="floatingInput">Select an event type...</option>
                                </select>
                                <!--Button to add a new event type-->
                                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#AddEventTypeModal">
                                    + New
                                </button>
                            </div>
                        </div>
                    <!--Input for the Start Date-->
                        <div class="form-floating mb-3">
                            <input type="datetime-local" class="form-control" id="StartDateInput" name="startDate" placeholder="Date">
                            <label for="floatingInput">Start Date*</label>
                        </div>
                    <!--Input for the End Date-->
                        <div class="form-floating mb-3">
                            <input type="datetime-local" class="form-control" id="EndDateInput" name="endDate" placeholder="Date">
                            <label for="floatingInput">End Date</label>
                        </div>
                        <span class="text-muted small">* Required Field</span>
                    </div>

                    <!-- Hidden input to store Event ID for editing -->
                    <input type="hidden" id="EventIdInput" name="id" value="">

                    <!--Modal Footer-->
                    <div class="modal-footer">
                        <!--Button to Save-->
                        <!-- data-bs-dismiss closes the modal -->
                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close" id="SaveEventButton">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div> 


    <!--Add Event Type Modal-->
    <div class="modal fade" id="AddEventTypeModal" aria-hidden="true" aria-labelledby="eventTypeLabel" tabindex="-1">
        <!--modal-dialog is the container for the modal content-->
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fs-6" id="eventTypeLabel">New Category</h5>
                    <button type="button" class="btn-close" data-bs-toggle="modal" data-bs-target="#InputEventDetails" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="NewEventTypeForm">
                        <div class="mb-2">
                            <input type="text" class="form-control form-control-sm" id="NewTypeName" placeholder="Category Name (e.g. Work)" required>
                        </div>

                        <div class="mb-2">
                            <select class="form-select form-select-sm" id="NewTypeColour" required>
                                <option selected disabled value="">Pick a colour...</option>
                                <!--Bootstrap colour options, with their corresponding classes-->
                                <option value="Red">Red</option> <!--danger-->
                                <option value="Blue">Blue</option> <!--primary-->
                                <option value="Green">Green</option> <!--success-->
                                <option value="Yellow">Yellow</option> <!--warning-->
                                <option value="Grey">Grey</option> <!--secondary-->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Create Type</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!--Event Detail Modal-->
    <div class="modal fade" id="EventDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Event Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body">
                    <h4 id="DetailTitle" class="fw-bold">[Title]</h4>
                    <p id="DetailDescription" class="text-secondary">[Description]</p>
                    
                    <hr>
                    
                    <div class="mb-2">
                        <strong>📍 Location:</strong> <span id="DetailLocation">[Location]</span>
                    </div>
                    <div>
                        <strong>🕒 Time:</strong> <span id="DetailTime">[Time]</span>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="EditEventButton">Edit</button>
                    <button type="button" class="btn btn-danger" id="DeleteEventButton">Delete</button>
                </div>
            </div>
        </div>
    </div>


    </body>
</html>
