<!doctype html>
<!--Throughout this code the Bootstrap framework has been used -->
<!-- I am making a Calendar Application with a vertical timeline. (Like the Google Calendar Schedule Mode) -->
<html lang="en" data-bs-theme="dark"> <!-- data-bs-theme is for Bootstrap to use Dark Mode -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Calendar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
        <link rel="stylesheet" href="Calendar.css">
        <script src="Calendar.js" defer></script> <!-- defer tells the browser to not wait for the script to load (loads it in the backgound) -->
    </head>
    <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <div class="p-2 mb-2 bg-secondary text-white align-items-center">
        <div class="container">
            <div class="row align-items-center"> <!-- align-items-center centers the content vertically -->
                <div class="col-2 d-flex justify-content-center align-items-center"> <!-- justify-content-center centers horizontally, align-items-center centers vertically, d-flex makes the content flexible to changes in screen size -->
                    <!-- Button to trigger modals -->
                    <button class="btn btn-primary text-center" data-bs-target="#TitleModal" data-bs-toggle="modal"> <!-- data-bs-target is the id of the modal to open -->
                        <b><h3>Add Event</h3></b>
                    </button>
                </div>
                <div class="col-10 d-flex justify-content-center align-items-center">
                    <!-- Centered Title -->
                    <div class="container py-3 text-center justify-content-center d-flex align-items-center"> <!-- py-3 is padding y-axis 3 -->
                        <div class="position-relative top-0 start-50 translate-middle-x">
                            <h1>Welcome to my Calendar!</h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div> <!-- Modals -->  
        <!-- Title Modal -->
        <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
        <div class="modal fade" id="TitleModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Add Event Title</h1> <!-- fs-5 is font size 5 -->
                        <!-- Button to close the modal -->
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!--Text Box to input the Title-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="TitleInput" placeholder="Title">
                            <label for="floatingInput">Title</label>
                        </div>
                    </div>
                    <!--Button to go to Description Modal-->
                    <div class="modal-footer">
                        <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Continue</button> <!-- data-bs-target is the id of the modal to open -->
                    </div>
                </div>
            </div>
        </div>
        <!-- Description Modal -->
        <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
        <div class="modal fade" id="DescriptionModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Description</h1> <!-- fs-5 is font size 5 -->
                        <!-- Button to close the modal -->
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!--Text Box to input the Description-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <textarea class="form-control" id="DescriptionInput" placeholder="Description"></textarea> <!-- Textarea for multi-line input -->
                            <label for="floatingInput">Description</label>
                        </div>
                    </div>
                    <!--Button to go to other Modals-->
                    <div class="modal-footer">
                        <!--Button to Return to Title Modal-->
                        <button class="btn btn-primary" data-bs-target="#TitleModal" data-bs-toggle="modal">Back</button>
                        <!--Button to go to the Location Modal-->
                        <button class="btn btn-primary" data-bs-target="#LocationModal" data-bs-toggle="modal">Continue</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Location Modal -->
        <!-- "modal fade" for the transistion, "static" prevents closing the modal when clicking outside of it, aria is for accessibility -->
        <div class="modal fade" id="LocationModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Location</h1> <!-- fs-5 is font size 5 -->
                        <!-- Button to close the modal -->
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!--Text Box to input the Location-->
                        <div class="form-floating mb-3"> <!-- form-floating is for floating labels, mb-3 is margin bottom 3 -->
                            <input type="text" class="form-control" id="LocationInput" placeholder="Location">
                            <label for="floatingInput">Location</label>
                        </div>
                    </div>
                    <!--Button to Return to Descrption Modal-->
                    <div class="modal-footer">
                        <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Back</button>
                        <!--Button to go to the Time Modal-->
                        <button class="btn btn-primary" data-bs-target="#TimeModal" data-bs-toggle="modal">Continue</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Time Modal -->
        <div class="modal fade" id="TimeModal" data-bs-backdrop="static" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Add Event Time</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    <!--Input for the Start Date-->
                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="StartDateInput" placeholder="Date">
                            <label for="floatingInput">Start Date</label>
                        </div>
                    <!--Input for the End Date-->
                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="EndDateInput" placeholder="Date">
                            <label for="floatingInput">End Date</label>
                        </div>
                    </div>
                    <!--Button to Return to Location Modal-->
                    <div class="modal-footer">
                        <button class="btn btn-primary" data-bs-target="#DescriptionModal" data-bs-toggle="modal">Back</button>
                        <!--Button to Save-->
                        <!-- data-bs-dismiss closes the modal -->
                        <!-- Defensively specified to be a button in case I want to add form submission later for input validation -->
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close" id="SaveEventButton">Save</button> <!-- Added an ID to be Used in JavaScript -->
                    </div>
                </div>
            </div>
        </div>   
    </div>

    <div class="container text-center">
        <div class="row">
            <div class="col-2 justify-content-center align-items-center d-flex" id="Timeline">
                Date timeline here
            </div>
            <div class="col-10 justify-content-center align-items-center d-flex" id="DisplayEvents">
                Events will be displayed here
            </div>
        </div>
    </div>



        <!-- DOM to access form elements, (process and store later) Add a Bootstrap Collumn-->

    </body>
</html>
